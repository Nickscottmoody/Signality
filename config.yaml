# ============================================================
# Signality settings. Every adjustable number lives in this file.
# Change a value here and the whole agent changes behavior.
# ============================================================

# --- How often Signality checks the news ---
polling:
  interval_minutes: 15        # how many minutes between checks of every feed
  max_articles_per_feed: 25   # most stories to read from one feed per check (keeps it fast)
  article_char_cap: 6000      # longest piece of article text we send to the AI (controls cost)
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Signality/0.1"  # how we identify ourselves to websites (some block unknown visitors)

# --- Importance score (0-100). The AI rates 4 factors 1-5; code does the math. ---
importance:
  weights:
    impact: 0.35              # how big the consequences are
    breadth: 0.25             # how many people or companies it touches
    urgency: 0.20             # how time-sensitive it is
    novelty: 0.20             # how new or surprising it is
  thresholds:
    alert: 75                 # 75 and up: instant alert with sound
    silent: 50                # 50-74: silent message
    digest: 25                # 25-49: morning digest; below 25 is stored only
  alert_cap_per_day: 3        # most loud alerts allowed in one day

# --- Topics Signality watches, and how much to favor each ---
topics:
  model_releases: 1.0         # new AI models and major updates
  research: 1.0               # papers and technical findings
  companies_funding: 1.0      # company news, funding rounds, acquisitions
  policy: 1.0                 # laws, regulation, government action
  tools: 1.0                  # new AI products and developer tools
  jobs: 1.3                   # AI's effect on jobs and careers (favored)
  finance_analytics: 1.3      # finance, data and analytics work (favored)

# --- Which Claude model does which job (swap these strings to change models) ---
models:
  bulk: claude-haiku-5-5      # cheap, high volume: summaries, tags, factor ratings, duplicates
  high_stakes: claude-sonnet-5-5  # careful work: alert checks, claim resolution, impact notes, chat
  deep: claude-opus-5-5       # NOT used by default; only after a side-by-side test proves it's worth it

# --- Spending guardrail ---
budget:
  monthly_usd_cap: 10         # target ceiling for AI costs per month
  warn_at_percent: 80         # tell me when spending passes this share of the cap

# --- Morning digest delivery ---
digest:
  send_hour: 8                # hour of day (24-hour clock) to send the digest
  timezone: America/New_York  # which clock to use for the digest hour

# --- News sources (RSS feeds). lean = political lean for the bias audit. ---
# Types: "primary" = the company or agency itself; "outlet" = a news organization;
#        "research" = papers. Primary sources outrank outlets for validity labels.
sources:
  - id: openai
    name: OpenAI Blog
    url: https://openai.com/news/rss.xml
    type: primary
    lean: n/a
  - id: simonwillison
    name: Simon Willison's Blog (independent AI analysis)
    url: https://simonwillison.net/atom/everything/
    type: outlet
    lean: n/a
  - id: deepmind
    name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    type: primary
    lean: n/a
  - id: huggingface
    name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    type: primary
    lean: n/a
  - id: arxiv_ai
    name: arXiv cs.AI (research papers)
    url: http://export.arxiv.org/rss/cs.AI
    type: research
    lean: n/a
  - id: federal_register_ai
    name: Federal Register — AI documents
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=artificial+intelligence
    type: primary
    lean: center
  - id: techcrunch_ai
    name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    type: outlet
    lean: center-left
  - id: verge_ai
    name: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    type: outlet
    lean: center-left
  - id: venturebeat_ai
    name: VentureBeat AI
    url: https://venturebeat.com/category/ai/feed/
    type: outlet
    lean: center
  - id: arstechnica
    name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/technology-lab
    type: outlet
    lean: center-left
  - id: mit_tech_review
    name: MIT Technology Review
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    type: outlet
    lean: center
