# ============================================================
# Signality settings. Every adjustable number lives in this file.
# Change a value here and the whole agent changes behavior.
# ============================================================

# --- How often Signality checks the news ---
polling:
  interval_minutes: 15        # how many minutes between checks of every feed
  max_articles_per_feed: 25   # most stories to read from one feed per check (keeps it fast)
  article_char_cap: 6000      # longest piece of article text we send to the AI (controls cost)
  user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Signality/0.1"  # how we identify ourselves to websites (some block unknown visitors)
  request_timeout_seconds: 20 # give up on a feed that hasn't answered after this many seconds
  max_article_age_days: 7     # ignore stories published longer ago than this
  snippet_char_cap: 1000      # longest preview text we store per story

# --- Duplicate detection (free; smarter AI matching is added in Stage 2a) ---
dedup:
  title_similarity: 0.6       # 0-1: how alike two headlines must be to count as the same story
  window_hours: 72            # only compare against stories seen in the last this-many hours
  min_title_words: 3          # headlines shorter than this are never auto-grouped (too risky)

# --- Where data is saved on this computer (the data/ folder is never uploaded) ---
storage:
  db_path: data/signality.db  # the SQLite database file
  log_path: data/signality.log  # running diary of what the agent did (newest at the bottom)

# --- Importance score (0-100). The AI rates 4 factors 1-5; code does the math. ---
importance:
  weights:
    impact: 0.35              # how big the consequences are
    breadth: 0.25             # how many people or companies it touches
    urgency: 0.20             # how time-sensitive it is
    novelty: 0.20             # how new or surprising it is
  thresholds:
    alert: 75                 # 75 and up: instant alert with sound
    silent: 50                # 50-74: silent message
    digest: 25                # 25-49: morning digest; below 25 is stored only
  alert_cap_per_day: 3        # most loud alerts allowed in one day

# --- Triage: Haiku reads each new story, summarizes it, and rates it ---
triage:
  enabled: true               # ON (approved in Stage 2a step 6): the agent triages new stories every round
  max_per_round: 40           # most stories to triage in one round (caps cost per round)
  max_story_age_hours: 48     # never spend money on stories first seen longer ago than this
  fetch_full_text: true       # read the full article page when it's free to read (better summaries)
  dedup_candidates: 8         # how many similar recent headlines Haiku checks for "same event"

# --- Topics Signality watches, and how much to favor each ---
topics:
  model_releases: 1.0         # new AI models and major updates
  research: 1.0               # papers and technical findings
  companies_funding: 1.0      # company news, funding rounds, acquisitions
  policy: 1.0                 # laws, regulation, government action
  tools: 1.0                  # new AI products and developer tools
  jobs: 1.1                   # AI's effect on jobs and careers (favored: small boost, chosen in step 5)
  finance_analytics: 1.1      # finance, data and analytics work (favored: small boost, chosen in step 5)

# --- Which Claude model does which job (swap these strings to change models) ---
models:
  bulk: claude-haiku-5-5      # cheap, high volume: summaries, tags, factor ratings, duplicates
  high_stakes: claude-sonnet-5-5  # careful work: alert checks, claim resolution, impact notes, chat
  deep: claude-opus-5-5       # NOT used by default; only after a side-by-side test proves it's worth it
  effort:                     # how hard each model thinks: low | medium | high (higher = better but pricier)
    bulk: low                 # triage is simple and high-volume, so keep it light
    high_stakes: medium       # alert checks and claim decisions get more care
    deep: medium              # only used in side-by-side tests for now
  max_output_tokens: 4000     # hard ceiling on one reply's length (includes the model's thinking)
  # Price per 1 million tokens, in US dollars (a token is roughly 3/4 of a word).
  # From Anthropic's published pricing; update here if prices change.
  # cache_write/cache_read: price for instructions reused across calls (much cheaper to reread).
  prices_per_million_usd:
    claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_write: 0.125, cache_read: 0.01}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50,  cache_read: 0.20}
    claude-opus-5-5:   {input: 4.00, output: 20.00, cache_write: 5.00,  cache_read: 0.20}

# --- Siggy, the mascot: which picture goes with which kind of message ---
siggy:
  images:
    normal: assets/siggy-logo.png       # yellow logo: normal messages
    alert: assets/siggy-alert.png       # red alert: every 🚨 alert
    thinking: assets/siggy-thinking.png # teal "SCANNING": while answering your questions
  # Public copies of the same pictures. Telegram shows these ABOVE a long text message, so a
  # message too long for a photo caption still arrives as ONE notification (needs the GitHub repo
  # to stay public; if a picture can't load, the text still arrives).
  image_urls:
    normal: https://raw.githubusercontent.com/Nickscottmoody/Signality/main/assets/siggy-logo.png
    alert: https://raw.githubusercontent.com/Nickscottmoody/Signality/main/assets/siggy-alert.png
    thinking: https://raw.githubusercontent.com/Nickscottmoody/Signality/main/assets/siggy-thinking.png

# --- Spending guardrail ---
budget:
  monthly_usd_cap: 10         # target ceiling for AI costs per month
  warn_at_percent: 80         # tell me when spending passes this share of the cap

# --- Morning digest delivery ---
digest:
  send_hour: 8                # hour of day (24-hour clock) to send the digest
  timezone: America/Chicago   # your clock: digest hour and "per day" alert cap use it (Central time)
  max_items: 15               # most stories in one digest (the highest-scoring ones)
  lookback_hours: 24          # stories first seen in this window are eligible for the digest

# --- Delivery: what gets sent to your phone ---
delivery:
  enabled: true               # ON (switched on in Stage 2a step 6); set false to stop all messages
  max_age_hours: 12           # only send 🚨/🔔 right away for stories first seen this recently
  silent_messages: false      # false = 🔔 stories (50-74) wait for the morning digest instead of arriving during the day
  image_on_silent: false      # also attach yellow Siggy to every 🔔 message (busier chat)

# --- AI keyword filter (free, runs in code before any paid AI step) ---
# Sources marked ai_filter: true cover more than AI, so their stories must mention
# at least one of these words in the headline or preview to be kept.
ai_filter_keywords:
  - "AI"                      # matched as a whole word, so "said" or "paid" don't count
  - "A.I."
  - artificial intelligence
  - machine learning
  - large language model
  - LLM
  - chatbot
  - generative
  - ChatGPT
  - OpenAI
  - Anthropic
  - Claude
  - Gemini
  - DeepMind
  - Copilot
  - Nvidia
  - data center
  - neural

# --- News sources (RSS feeds) ---
# type:       primary = the organization the news is about (earns ✅ Confirmed)
#             news = professional newsroom; specialist = AI-focused outlet
# lean:       political lean for the bias audit. PLACEHOLDER estimates for now;
#             replaced with ratings from a public bias-rating site in Stage 2b.
# paywalled:  true = we only get headline + preview, so summaries are marked "partial"
# ai_filter:  true = feed covers more than AI, so apply ai_filter_keywords first
# via:        google_news = outlet has no public feed; we use a Google News search
#             limited to its site, and must follow Google's link to the real article
sources:
  # Primary sources
  - id: openai
    name: OpenAI Blog
    url: https://openai.com/news/rss.xml
    type: primary
    lean: n/a
    paywalled: false
    ai_filter: false
  - id: deepmind
    name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    type: primary
    lean: n/a
    paywalled: false
    ai_filter: false
  - id: google_ai
    name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
    type: primary
    lean: n/a
    paywalled: false
    ai_filter: false
  - id: nvidia
    name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/
    type: primary
    lean: n/a
    paywalled: false
    ai_filter: false
  - id: huggingface
    name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    type: primary
    lean: n/a
    paywalled: false
    ai_filter: false
  - id: federal_register_ai
    name: Federal Register (AI documents)
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=artificial+intelligence
    type: primary
    lean: n/a
    paywalled: false
    ai_filter: true   # search matches any passing mention of AI, so filter

  # Top-tier news
  - id: reuters
    name: Reuters
    url: https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=site:reuters.com+(intitle:AI+OR+intitle:%22artificial+intelligence%22)+when:7d
    type: news
    lean: center
    paywalled: false
    ai_filter: false
    via: google_news
  - id: ap
    name: Associated Press
    url: https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=site:apnews.com+(intitle:AI+OR+intitle:%22artificial+intelligence%22)+when:7d
    type: news
    lean: lean-left
    paywalled: false
    ai_filter: false
    via: google_news
  - id: wsj
    name: Wall Street Journal (Tech)
    url: https://feeds.content.dowjones.io/public/rss/RSSWSJD
    type: news
    lean: center
    paywalled: true
    ai_filter: true
  - id: bloomberg
    name: Bloomberg Technology
    url: https://feeds.bloomberg.com/technology/news.rss
    type: news
    lean: lean-left
    paywalled: true
    ai_filter: true
  - id: ft_ai
    name: Financial Times (AI)
    url: https://www.ft.com/artificial-intelligence?format=rss
    type: news
    lean: center
    paywalled: true
    ai_filter: false

  # AI specialists
  - id: the_information
    name: The Information
    url: https://www.theinformation.com/feed
    type: specialist
    lean: unrated
    paywalled: true
    ai_filter: true
  - id: mit_tech_review
    name: MIT Technology Review (AI)
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    type: specialist
    lean: unrated
    paywalled: false
    ai_filter: false
  - id: arstechnica_ai
    name: Ars Technica (AI)
    url: https://arstechnica.com/ai/feed/
    type: specialist
    lean: unrated
    paywalled: false
    ai_filter: false
  - id: techcrunch_ai
    name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    type: specialist
    lean: unrated
    paywalled: false
    ai_filter: false

  # Viewpoint balance (policy)
  - id: reason
    name: Reason (Technology)
    url: https://reason.com/category/technology/feed/
    type: news
    lean: lean-right
    paywalled: false
    ai_filter: true
